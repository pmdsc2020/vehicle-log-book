name: vehicle_log_book
description: Vehicle Log Book - staff vehicle trip logging with odometer photos and monthly claims
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  geolocator: 12.0.0
  crypto: ^3.0.3
  intl: ^0.19.0
  share_plus: ^7.2.1
  file_picker: ^8.0.0
  uuid: ^4.3.3
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/

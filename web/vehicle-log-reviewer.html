/* Layout: a bar on top; the inbox is one table; an open report is the statement and trip table on the left
   with a sticky sign-off column on the right, so the decision stays in view while the trips are checked. */
:root {
  --paper: #f1f5f3;
  --card: #ffffff;
  --card-2: #f6f9f7;
  --ink: #12221c;
  --ink-2: #485a52;
  --ink-3: #74857d;
  --line: #d8e1dc;
  --line-2: #e7edea;
  --brand: #0d6b55;
  --brand-deep: #08493a;
  --brand-soft: #dcefe8;
  --on-brand: #ffffff;
  --link: #0b6350;
  --amber: #f2a93b;
  --amber-soft: #fcefd3;
  --amber-ink: #6b4200;
  --ok: #0d6b55;
  --ok-soft: #dcefe8;
  --warn: #9a5800;
  --warn-soft: #fcefd3;
  --bad: #b3261e;
  --bad-soft: #fbdedb;
  --info: #28587f;
  --info-soft: #dce9f5;
  --drum: #1b2b25;
  --drum-ink: #f4f8f6;
  --shade: rgba(9, 20, 15, 0.55);
  --shadow: 0 1px 2px rgba(18, 34, 28, 0.06), 0 6px 20px rgba(18, 34, 28, 0.05);
  --font: 'Barlow Semi Condensed', 'Segoe UI', system-ui, -apple-system, 'Noto Sans', 'Noto Sans Devanagari', sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --paper: #0c1411;
    --card: #131f1a;
    --card-2: #19271f;
    --ink: #e6efea;
    --ink-2: #a4b6ac;
    --ink-3: #78897f;
    --line: #26382f;
    --line-2: #1e2d26;
    --brand: #12805f;
    --brand-deep: #0f6a50;
    --brand-soft: #14382d;
    --link: #53d3ab;
    --amber-soft: #3a2b0e;
    --amber-ink: #f6c877;
    --ok: #53d3ab;
    --ok-soft: #14382d;
    --warn: #f2b250;
    --warn-soft: #3a2b0e;
    --bad: #ff8d84;
    --bad-soft: #40201d;
    --info: #8fc3f0;
    --info-soft: #172c40;
    --drum: #0a100d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --paper: #0c1411;
  --card: #131f1a;
  --card-2: #19271f;
  --ink: #e6efea;
  --ink-2: #a4b6ac;
  --ink-3: #78897f;
  --line: #26382f;
  --line-2: #1e2d26;
  --brand: #12805f;
  --brand-deep: #0f6a50;
  --brand-soft: #14382d;
  --link: #53d3ab;
  --amber-soft: #3a2b0e;
  --amber-ink: #f6c877;
  --ok: #53d3ab;
  --ok-soft: #14382d;
  --warn: #f2b250;
  --warn-soft: #3a2b0e;
  --bad: #ff8d84;
  --bad-soft: #40201d;
  --info: #8fc3f0;
  --info-soft: #172c40;
  --drum: #0a100d;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.45 var(--font);
  font-variant-numeric: tabular-nums;
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--card);
}
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
svg.i { width: 1em; height: 1em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.wrap {
  max-width: 1480px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.brand svg { width: 36px; height: 36px; flex: none; border-radius: 9px; }
.brand b { display: block; font-size: 19px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
.brand small { display: block; color: var(--ink-3); font-size: 13px; line-height: 1.2; }
.spacer { flex: 1; }
.me { display: inline-flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px 0 5px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); cursor: pointer; max-width: 300px; }
.me:hover { background: var(--card-2); }
.me .av { width: 32px; height: 32px; font-size: 13px; }
.me span.t { display: block; min-width: 0; line-height: 1.15; text-align: left; }
.me strong { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me em { display: block; font-style: normal; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.av { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; flex: none; background: linear-gradient(135deg, var(--brand), var(--brand-deep)); color: #fff; font-weight: 700; font-size: 15px; }

/* ---------- controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--card-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-deep); border-color: var(--brand-deep); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--card-2); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 32px; padding: 0 10px; font-size: 14px; border-radius: 8px; }
.btn.big { height: 48px; font-size: 16px; width: 100%; }
.btn.icon { width: 40px; padding: 0; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn svg { font-size: 18px; }
.field { display: grid; gap: 6px; }
.field label, .lbl { font-weight: 600; font-size: 14px; color: var(--ink-2); }
.input, textarea.input, select.input { width: 100%; min-height: 42px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
textarea.input { resize: vertical; min-height: 96px; line-height: 1.4; }
.input:focus-visible { outline-offset: 0; border-color: var(--amber); }
.input.err { border-color: var(--bad); }
.hint { font-size: 13px; color: var(--ink-3); }
.errtext { font-size: 14px; color: var(--bad); font-weight: 600; }

.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 1px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--card-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.pill svg { font-size: 14px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.pill.you { background: var(--amber); color: #2b1a00; border-color: transparent; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.pad { padding: 18px 20px; }
.card > h2, .card .ch { font-size: 18px; font-weight: 700; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.mono { font-family: var(--mono); font-size: 0.86em; letter-spacing: 0; }

main { padding-block: 24px 80px; }
.pagehead { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.pagehead h1 { font-size: 30px; font-weight: 700; line-height: 1.1; }
.pagehead p { color: var(--ink-2); margin-top: 4px; }
.tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); flex-wrap: wrap; }
.tab { height: 34px; padding: 0 12px; border-radius: 9px; border: 0; background: transparent; font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.tab[aria-selected='true'] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.tab .n { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--line); color: var(--ink-2); font-size: 12px; display: inline-grid; place-items: center; }
.tab .n.hot { background: var(--amber); color: #2b1a00; }

.banner { display: flex; gap: 14px; align-items: center; padding: 14px 18px; border-radius: 14px; background: var(--amber-soft); color: var(--amber-ink); margin-bottom: 16px; flex-wrap: wrap; }
.banner > div { flex: 1; min-width: 220px; }
.banner.info { background: var(--info-soft); color: var(--info); }

/* ---------- empty state / drop */
.drop { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0; overflow: hidden; }
.drop .l { padding: 36px 36px 32px; display: grid; gap: 16px; align-content: start; }
.drop h2 { font-size: 30px; line-height: 1.1; font-weight: 700; }
.drop .r { background: var(--brand-soft); padding: 32px 32px; display: grid; gap: 18px; align-content: center; border-left: 1px solid var(--line); }
.drop ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 16px; counter-reset: s; }
.drop li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; }
.drop li::before { content: counter(s); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--drum); color: var(--drum-ink); font-weight: 700; font-size: 14px; }
.drop li b { display: block; font-size: 16px; }
.drop li span { color: var(--ink-2); font-size: 14.5px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.veil { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(8, 73, 58, 0.93); color: #fff; font-size: 30px; font-weight: 700; text-align: center; padding: 24px; }
.veil div { border: 3px dashed rgba(255, 255, 255, 0.6); border-radius: 24px; padding: 48px 56px; }
.veil small { display: block; font-size: 16px; font-weight: 500; opacity: 0.85; margin-top: 8px; }

/* ---------- inbox table */
.tablewrap { overflow-x: auto; position: relative; }
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th { text-align: left; font-size: 13px; font-weight: 600; color: var(--ink-3); padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--card); }
td { padding: 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
tr:last-child > td { border-bottom: 0; }
table.list tbody tr { cursor: pointer; }
table.list tbody tr:hover > td { background: var(--card-2); }
table.list tr.mine > td:first-child { box-shadow: inset 4px 0 0 var(--amber); }
table.list .num { text-align: right; white-space: nowrap; }
table.list th.num { text-align: right; }
.who { display: flex; align-items: center; gap: 12px; min-width: 200px; }
.who b { display: block; font-size: 16px; font-weight: 600; line-height: 1.2; }
.who small { color: var(--ink-3); font-size: 13px; }
.big-n { font-size: 20px; font-weight: 600; line-height: 1.1; }
.chain { display: inline-flex; align-items: center; }
.chain i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: block; }
.chain i.on { background: var(--brand); border-color: var(--brand); }
.chain i.now { border-color: var(--amber); background: var(--amber); }
.chain i.back { border-color: var(--bad); background: var(--bad); }
.chain u { width: 12px; height: 2px; background: var(--line); display: block; text-decoration: none; }
.chain u.on { background: var(--brand); }
.status { display: grid; gap: 6px; justify-items: start; }

/* ---------- report */
.crumbs { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.report { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 24px; align-items: start; }
.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; }
.aside { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; position: sticky; top: calc(60px + env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 92px - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 2px; margin: -2px; }
.rhead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.rhead .av { width: 60px; height: 60px; font-size: 22px; }
.rhead h1 { font-size: 28px; font-weight: 700; line-height: 1.1; }
.rhead .sub { color: var(--ink-2); margin-top: 3px; }
.rhead .month { text-align: right; }
.rhead .month b { display: block; font-size: 26px; line-height: 1.1; font-weight: 700; }
.rhead .month small { color: var(--ink-3); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line-2); color: var(--ink-2); font-size: 14px; }
.facts b { color: var(--ink); font-weight: 600; }
.callout { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--bad-soft); color: var(--ink); border: 1px solid transparent; }
.callout svg { font-size: 20px; color: var(--bad); margin-top: 2px; }
.callout.amber { background: var(--amber-soft); }
.callout.amber svg { color: var(--warn); }
.callout q { display: block; quotes: none; margin-top: 6px; white-space: pre-wrap; font-size: 15px; }

.checks .banner-ok { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.checks .shield { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); font-size: 22px; flex: none; }
.checks .shield.warn { background: var(--warn-soft); color: var(--warn); }
.checks .shield.bad { background: var(--bad-soft); color: var(--bad); }
.clines { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 2px; }
.cl { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 7px 0; }
.cl svg { font-size: 18px; margin-top: 2px; }
.cl.ok svg { color: var(--ok); } .cl.warn svg { color: var(--warn); } .cl.bad svg { color: var(--bad); } .cl.info svg { color: var(--info); }
.cl b { font-weight: 600; }
.cl span { display: block; color: var(--ink-2); font-size: 14px; }
.twocol { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.sec { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.sec h2 { font-size: 20px; font-weight: 700; }
.sec .faint { font-size: 14px; }

.ledger { display: grid; gap: 0; }
.lr { display: flex; align-items: baseline; gap: 8px; padding: 8px 0; }
.lr .d { flex: 1; border-bottom: 2px dotted var(--line); transform: translateY(-4px); min-width: 12px; }
.lr b { font-size: 18px; font-weight: 600; }
.lr.strong { font-size: 17px; font-weight: 700; }
.lr.strong b { font-size: 24px; color: var(--link); }
.lr.over b { color: var(--warn); }
.bars { display: grid; gap: 14px; }
.bar .t { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
.bar .t span { min-width: 0; overflow-wrap: anywhere; }
.bar .rail { height: 10px; border-radius: 99px; background: var(--line-2); margin: 6px 0 3px; overflow: hidden; }
.bar .rail i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #4f9a86, var(--brand)); }
.bar small { color: var(--ink-3); }

.tbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.tbar h2 { font-size: 20px; font-weight: 700; margin-right: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { height: 32px; padding: 0 12px; border: 0; background: var(--card); font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed='true'] { background: var(--brand); color: var(--on-brand); }
.prog { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 14px; color: var(--ink-2); font-weight: 600; }
.prog .rail { width: 120px; height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.prog .rail i { display: block; height: 100%; background: var(--brand); transition: width 0.2s; }
table.trips th, table.trips td { padding: 12px 12px; }
table.trips td { vertical-align: top; }
table.trips tr.row { cursor: pointer; }
table.trips tr.row:hover > td { background: var(--card-2); }
table.trips tr.row.open > td { background: var(--card-2); border-bottom-color: transparent; }
table.trips tr.row.q > td:first-child { box-shadow: inset 4px 0 0 var(--bad); }
table.trips tr.gone td.rt, table.trips tr.gone td.wk { color: var(--ink-3); }
table.trips tr.gone td.rt b { text-decoration: line-through; }
.date b { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; }
.date small { color: var(--ink-3); font-size: 13px; }
.rt b { font-size: 16px; font-weight: 600; display: block; }
.rt small { color: var(--ink-3); font-size: 13px; }
.wk b { display: block; font-weight: 600; }
.wk small { color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rd { white-space: nowrap; font-size: 16px; font-weight: 500; }
.km { font-size: 20px; font-weight: 700; white-space: nowrap; text-align: right; }
.km small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.ths { display: flex; gap: 6px; }
.thumb { position: relative; width: 70px; height: 52px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--drum); padding: 0; cursor: zoom-in; flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb span { position: absolute; left: 3px; bottom: 3px; font-size: 10.5px; line-height: 1; padding: 2px 4px; border-radius: 4px; color: #fff; background: rgba(0, 0, 0, 0.62); font-weight: 600; }
.thumb:hover { border-color: var(--amber); }
.thumb.lg { width: 100%; height: auto; aspect-ratio: 4 / 3; border-radius: 10px; }
.thumb.lg span { font-size: 12px; padding: 3px 6px; left: 6px; bottom: 6px; }
.thumb.none { cursor: default; display: grid; place-items: center; color: var(--ink-3); font-size: 11px; background: var(--card-2); }
.flags { display: flex; flex-wrap: wrap; gap: 5px; }
.ck { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); background: var(--card); display: inline-grid; place-items: center; cursor: pointer; margin: 0; }
.ck:checked { background: var(--brand); border-color: var(--brand); }
.ck:checked::after { content: ''; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.qbtn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--ink-3); cursor: pointer; display: inline-grid; place-items: center; font-size: 16px; }
.qbtn:hover { background: var(--card-2); color: var(--ink); }
.qbtn[aria-pressed='true'] { background: var(--bad-soft); color: var(--bad); }
tr.detail > td { padding: 0 12px 16px 56px; background: var(--card-2); }
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; padding-top: 4px; }
.kv { display: grid; gap: 8px; align-content: start; }
.kv div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; font-size: 14.5px; }
.kv dt, .kv .k { color: var(--ink-3); }
.kv .v { overflow-wrap: anywhere; white-space: pre-wrap; }
.rdg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rdg > div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; align-content: start; }
.rdg .k { color: var(--ink-3); font-size: 13px; font-weight: 600; }
.rdg small { color: var(--ink-3); font-size: 12.5px; display: block; }
.note { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.note small { display: block; color: var(--ink-3); }
.aid { display: block; font-size: 13.5px; margin-top: 4px; }
.aid.warn { color: var(--warn); font-weight: 600; }
.aid.info { color: var(--info); }

/* odometer drums: the one place the page shows its subject */
.drums { display: inline-flex; gap: 3px; vertical-align: middle; }
.drums b { display: inline-grid; place-items: center; width: 24px; height: 34px; border-radius: 5px; background: var(--drum); color: var(--drum-ink); font: 700 21px/1 var(--font); box-shadow: inset 0 -8px 10px rgba(0, 0, 0, 0.35), inset 0 6px 8px rgba(255, 255, 255, 0.06); }
.drums b:last-child { background: #cf9526; color: #1a1100; }
.drums.lg b { width: 34px; height: 50px; font-size: 32px; border-radius: 7px; }
.drums.sm b { width: 17px; height: 24px; font-size: 15px; border-radius: 4px; }

/* sign-off column */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: relative; }
.step { display: grid; justify-items: center; gap: 6px; text-align: center; position: relative; }
.step .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); background: var(--card); color: #fff; z-index: 1; font-size: 14px; }
.step.done .dot { background: var(--brand); border-color: var(--brand); }
.step.now .dot { border-color: var(--amber); background: var(--card); box-shadow: 0 0 0 4px var(--amber-soft); }
.step.now .dot::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--amber); }
.step.back .dot { background: var(--bad); border-color: var(--bad); }
.step::before { content: ''; position: absolute; top: 12px; left: -50%; width: 100%; height: 2px; background: var(--line); }
.step:first-child::before { display: none; }
.step.done::before, .step.now::before, .step.back::before { background: var(--brand); }
.step.back::before { background: var(--bad); }
.step b { font-size: 13.5px; line-height: 1.15; font-weight: 600; }
.step small { font-size: 12px; color: var(--ink-3); line-height: 1.1; }
.tl { display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
.tl li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; }
.tl .c { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font-size: 16px; }
.tl .c.back { background: var(--bad-soft); color: var(--bad); }
.tl b { display: block; font-weight: 600; line-height: 1.2; }
.tl small { color: var(--ink-3); display: block; }
.tl .rem { margin-top: 6px; padding: 8px 12px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line-2); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; }
.sign h2 { font-size: 20px; font-weight: 700; }
.sign .role { color: var(--ink-2); margin: 2px 0 12px; }
.meter { display: grid; gap: 6px; padding: 12px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line-2); margin-bottom: 12px; }
.meter .rail { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter .rail i { display: block; height: 100%; background: var(--brand); transition: width 0.2s; }
.meter .row { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 14px; }
.switch { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin: 12px 0; cursor: pointer; }
.switch b { display: block; font-weight: 600; }
.switch span { color: var(--ink-2); font-size: 14px; }
.switch input { position: absolute; opacity: 0; }
.switch .tr { width: 46px; height: 26px; border-radius: 99px; background: var(--line); position: relative; transition: background 0.15s; }
.switch .tr::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked + .tr { background: var(--brand); }
.switch input:checked + .tr::after { transform: translateX(20px); }
.switch input:focus-visible + .tr { outline: 2px solid var(--amber); outline-offset: 2px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.sealnote { color: var(--ink-3); font-size: 13px; margin-top: 10px; }
.sendcard { border-color: var(--brand); }
.sendcard h2 { font-size: 19px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.sendcard h2 svg { color: var(--ok); }
.msgbox { font: 13.5px/1.4 var(--font); min-height: 110px; background: var(--card-2); }
.links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }

/* ---------- dialogs */
dialog { color: var(--ink); }
dialog.modal { border: 1px solid var(--line); border-radius: 18px; background: var(--card); padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35); }
dialog.modal.wide { width: min(720px, calc(100vw - 32px)); }

<body>
<div id="root"></div>
<input type="file" id="filein" multiple hidden>
<noscript>The reviewer needs JavaScript.</noscript>
<script>
/*
 * Vehicle Log Book reviewer: the part with no screen.
 *
 * Reads the same report file the phones send (.vlbreport), runs the same checks, signs, and writes the file
 * back. Every hash here is worked out exactly as the Flutter app does it (lib/services/report_service.dart and
 * lib/services/trip_rules.dart), including the way Dart writes numbers: a whole-number double is "4.0".
 * web/test checks this against report files made by the phone code.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.VLB = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const REPORT_FORMAT = 1;
  const FILE_EXT = 'vlbreport';
  const STEPS = ['submit', 'bi', 'acc', 'di'];
  const SAFE_NAME = /^[A-Za-z0-9_-]{1,80}$/;
  const MAX_FILE_BYTES = 120 * 1024 * 1024;
  const MAX_PHOTOS = 600;

  class ReportError extends Error {
    constructor(message) {
      super(message);
      this.name = 'ReportError';
    }
  }

  // ------------------------------------------------------------------ SHA-256

  const K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98,
    0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786,
    0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8,
    0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
    0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819,
    0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a,
    0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7,
    0xc67178f2,
  ]);

  /** Plain JavaScript SHA-256 of bytes, as hex. Used when the browser has no crypto.subtle. */
  function sha256Pure(data) {
    const len = data.length;
    const padded = new Uint8Array(((len + 9 + 63) >> 6) << 6);
    padded.set(data);
    padded[len] = 0x80;
    const dv = new DataView(padded.buffer);
    dv.setUint32(padded.length - 8, Math.floor((len * 8) / 4294967296));
    dv.setUint32(padded.length - 4, (len * 8) >>> 0);
    const h = new Uint32Array([
      0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19,
    ]);
    const w = new Uint32Array(64);
    for (let off = 0; off < padded.length; off += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
      for (let i = 16; i < 64; i++) {
        const a = w[i - 15], b = w[i - 2];
        const s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3);
        const s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      let a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
      for (let i = 0; i < 64; i++) {
        const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        const ch = (e & f) ^ (~e & g);
        const t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
        const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      h[0] += a; h[1] += b; h[2] += c; h[3] += d; h[4] += e; h[5] += f; h[6] += g; h[7] += hh;
    }
    let out = '';
    for (let i = 0; i < 8; i++) out += h[i].toString(16).padStart(8, '0');
    return out;
  }

  const hasSubtle = () =>
    typeof globalThis !== 'undefined' && globalThis.crypto && globalThis.crypto.subtle && globalThis.crypto.subtle.digest;

  function toHex(buf) {
    const b = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < b.length; i++) s += b[i].toString(16).padStart(2, '0');
    return s;
  }

  /** SHA-256 of a string (UTF-8) or of bytes, as lowercase hex. */
  async function sha256Hex(input) {
    const bytes = typeof input === 'string' ? new TextEncoder().encode(input) : input;
    if (hasSubtle()) {
      try {
        return toHex(await globalThis.crypto.subtle.digest('SHA-256', bytes));
      } catch (_) {
        /* fall through to the plain version */
      }
    }
    return sha256Pure(bytes);
  }

  // ------------------------------------------------------------------ JSON the way Dart writes it

  /** A number that Dart holds as a double. Whole values print with ".0". */
  class Dbl {
    constructor(n) {
      this.n = n;
    }
  }

  function dartDouble(n) {
    if (!Number.isFinite(n)) throw new ReportError('A number in the report is not valid.');
    if (Number.isInteger(n) && Math.abs(n) < 1e21) return String(n) + '.0';
    return String(n);
  }

  /** Same text as Dart's jsonEncode for the values used in seals. */
  function djson(v) {
    if (v === null || v === undefined) return 'null';
    if (v instanceof Dbl) return dartDouble(v.n);
    switch (typeof v) {
      case 'string':
        return JSON.stringify(v);
      case 'boolean':
        return v ? 'true' : 'false';
      case 'number':
        return Number.isInteger(v) ? String(v) : dartDouble(v);
      default:
        break;
    }
    if (Array.isArray(v)) return '[' + v.map(djson).join(',') + ']';
    const keys = Object.keys(v);
    return '{' + keys.map((k) => JSON.stringify(k) + ':' + djson(v[k])).join(',') + '}';
  }

  // ------------------------------------------------------------------ reading the file into a report

  const S = (v) => (v === null || v === undefined ? '' : String(v));
  const I = (v) => {
    if (typeof v === 'number') return Math.trunc(v);
    const n = parseInt(S(v), 10);
    return Number.isNaN(n) ? 0 : n;
  };
  const nn = (v, d) => (v === undefined || v === null ? d : v);
  const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

  function normReading(j) {
    j = isObj(j) ? j : {};
    let gps = null;
    if (j.gps !== null && j.gps !== undefined) {
      if (!isObj(j.gps) || typeof j.gps.lat !== 'number' || typeof j.gps.lng !== 'number') throw new ReportError('bad gps');
      gps = { lat: j.gps.lat, lng: j.gps.lng, acc: nn(j.gps.acc, 0) };
    }
    return {
      km: nn(j.km, 0),
      photo: nn(j.photo, null),
      photoHash: nn(j.photoHash, null),
      at: nn(j.at, ''),
      gps,
      photoTime: nn(j.photoTime, null),
      oldPhoto: nn(j.oldPhoto, false),
      prevKm: nn(j.prevKm, null),
      returnTo: nn(j.returnTo, null),
      remarks: nn(j.remarks, null),
    };
  }

  function normTrip(j) {
    if (!isObj(j)) throw new ReportError('bad trip');
    return {
      id: nn(j.id, ''),
      schema: nn(j.schema, 1),
      mode: nn(j.mode, 'start'),
      date: nn(j.date, ''),
      month: nn(j.month, ''),
      project: nn(j.project, ''),
      vehicle: nn(j.vehicle, ''),
      vtype: nn(j.vtype, ''),
      from: nn(j.from, ''),
      to: nn(j.to, ''),
      activity: nn(j.activity, ''),
      task: nn(j.task, ''),
      start: normReading(nn(j.start, {})),
      end: j.end !== null && j.end !== undefined ? normReading(j.end) : null,
      km: nn(j.km, null),
      status: nn(j.status, 'open'),
      late: nn(j.late, null),
      meterReset: nn(j.meterReset, null),
      prior: nn(j.prior, null),
      cancel: nn(j.cancel, null),
      notes: (Array.isArray(j.notes) ? j.notes : []).map((n) => ({ at: nn(isObj(n) ? n.at : '', ''), text: nn(isObj(n) ? n.text : '', '') })),
      loggedAt: nn(j.loggedAt, ''),
      chainPos: nn(j.chainPos, null),
      prevHash: nn(j.prevHash, null),
      lockedAt: nn(j.lockedAt, null),
      hash: nn(j.hash, null),
    };
  }

  function normSignoff(j) {
    if (!isObj(j)) throw new ReportError('bad signoff');
    return {
      step: S(j.step), userId: S(j.userId), name: S(j.name), designation: S(j.designation), role: S(j.role),
      at: S(j.at), decision: S(j.decision), remarks: S(j.remarks), excessApproved: j.excessApproved === true,
      prevHash: S(j.prevHash), hash: S(j.hash),
    };
  }

  function normReport(j) {
    try {
      if (!isObj(j)) throw new ReportError('This file is not a vehicle log report.');
      const id = S(j.reportId);
      if (!SAFE_NAME.test(id)) throw new ReportError('The report has a bad id.');
      const photoHashes = new Map();
      if (isObj(j.photoHashes)) {
        for (const k of Object.keys(j.photoHashes)) {
          if (!SAFE_NAME.test(k)) throw new ReportError('A photo in the report has a bad name.');
          photoHashes.set(k, S(j.photoHashes[k]));
        }
      }
      if (!isObj(j.staff) || !isObj(j.policy) || !isObj(j.summary)) throw new Error('shape');
      const rev = I(j.revision);
      const r = j.replaces;
      return {
        format: I(j.format),
        reportId: id,
        revision: rev < 1 ? 1 : rev,
        month: S(j.month),
        staff: {
          id: S(j.staff.id), name: S(j.staff.name), designation: S(j.staff.designation), block: S(j.staff.block),
          district: S(j.staff.district), mobile: S(j.staff.mobile),
        },
        policy: {
          org: S(j.policy.org), office: S(j.policy.office), limitKm: I(j.policy.limitKm),
          rate: nn(j.policy.rate, 0), scope: S(j.policy.scope) === '' ? 'staff' : S(j.policy.scope), highKm: I(j.policy.highKm),
        },
        summary: {
          trips: I(j.summary.trips), km: I(j.summary.km), within: I(j.summary.within), excess: I(j.summary.excess),
          amount: nn(j.summary.amount, 0),
        },
        submittedAt: S(j.submittedAt),
        replaces:
          r === null || r === undefined
            ? null
            : { revision: I(r.revision), step: S(r.step), name: S(r.name), role: S(r.role), remarks: S(r.remarks), at: S(r.at), hash: S(r.hash) },
        trips: j.trips.map(normTrip),
        photoHashes,
        contentHash: S(j.contentHash),
        signoffs: j.signoffs.map(normSignoff),
      };
    } catch (e) {
      if (e instanceof ReportError) throw e;
      throw new ReportError('This file is not a vehicle log report, or it is damaged.');
    }
  }

  // ------------------------------------------------------------------ labels

  const stepOfRole = (role) => (role === 'bi' || role === 'acc' || role === 'di' ? role : null);

  function stepRoleLabel(step) {
    return { bi: 'Block Integrator', acc: 'Accountant', di: 'District Integrator' }[step] || 'Field staff';
  }

  function signoffVerb(s) {
    if (s.decision === 'return') return 'Returned';
    return { bi: 'Checked', acc: 'Verified', di: 'Approved' }[s.step] || 'Sent';
  }

  function decisionsFor(step) {
    if (step === 'bi' || step === 'acc') return ['forward', 'return'];
    if (step === 'di') return ['approve', 'return'];
    return ['sent'];
  }

  // ------------------------------------------------------------------ dates and figures

  function fmtDate(ymd) {
    const p = String(ymd).split('-');
    return p.length !== 3 ? String(ymd) : p[2] + '-' + p[1] + '-' + p[0];
  }

  /** Whole number with Indian digit grouping: 1,23,456. */
  function fmtKm(n) {
    const s = String(Math.abs(Math.round(n)));
    let out;
    if (s.length <= 3) out = s;
    else {
      const head = s.slice(0, -3);
      const tail = s.slice(-3);
      let buf = '';
      for (let i = 0; i < head.length; i++) {
        if (i > 0 && (head.length - i) % 2 === 0) buf += ',';
        buf += head[i];
      }
      out = buf + ',' + tail;
    }
    return n < 0 ? '-' + out : out;
  }

  function fmtRs(n) {
    let whole = Math.floor(n);
    let paise = Math.round((n - whole) * 100);
    if (paise >= 100) {
      whole += 1;
      paise = 0;
    }
    const head = '₹' + fmtKm(whole);
    return paise === 0 ? head : head + '.' + String(paise).padStart(2, '0');
  }

  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function fmtMonthLong(m) {
    const y = parseInt(String(m).slice(0, 4), 10);
    const mo = parseInt(String(m).slice(5, 7), 10);
    return mo >= 1 && mo <= 12 ? MONTHS[mo - 1] + ' ' + y : String(m);
  }

  function shiftMonth(month, by) {
    const y = parseInt(month.slice(0, 4), 10) || 2000;
    const m = parseInt(month.slice(5, 7), 10) || 1;
    const d = new Date(Date.UTC(y, m - 1 + by, 1));
    return String(d.getUTCFullYear()).padStart(4, '0') + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
  }

  // ------------------------------------------------------------------ seals

  const gpsKey = (g) => (g === null ? '' : [new Dbl(g.lat), new Dbl(g.lng), g.acc]);

  /** The fields a trip seal covers (coreOf in trip_rules.dart). */
  function coreOf(t) {
    const s = t.start;
    const e = t.end;
    const lateInfo = t.late;
    const reset = t.meterReset;
    const prior = t.prior;
    const cancel = t.cancel;
    return [
      t.id, t.chainPos, t.date, t.project, t.vehicle, t.from, t.to, t.activity, t.task, t.mode,
      [s.km, nn(s.photoHash, ''), s.at, gpsKey(s.gps), nn(s.photoTime, ''), nn(s.prevKm, '')],
      e === null ? '' : [e.km, nn(e.photoHash, ''), e.at, gpsKey(e.gps), nn(e.photoTime, ''), nn(e.returnTo, ''), nn(e.remarks, '')],
      t.km,
      t.status,
      lateInfo === null ? '' : nn(lateInfo.reason, ''),
      reset === null ? '' : nn(reset.reason, ''),
      prior === null ? '' : [nn(prior.by, ''), nn(prior.date, ''), nn(prior.mode, ''), nn(prior.ref, ''), prior.none === true],
      cancel === null ? '' : [nn(cancel.reason, ''), nn(cancel.at, '')],
      t.loggedAt,
      nn(t.prevHash, ''),
    ];
  }

  const hashTrip = (t) => sha256Hex(djson(coreOf(t)));

  async function sealIntact(t) {
    return t.hash !== null && t.hash === (await hashTrip(t));
  }

  /** The trip as the phone writes it with toJson, for the report fingerprint. */
  function tripForHash(t) {
    const rd = (r) =>
      r === null
        ? null
        : {
            km: r.km, photo: r.photo, photoHash: r.photoHash, at: r.at,
            gps: r.gps === null ? null : { lat: new Dbl(r.gps.lat), lng: new Dbl(r.gps.lng), acc: r.gps.acc },
            photoTime: r.photoTime, oldPhoto: r.oldPhoto, prevKm: r.prevKm, returnTo: r.returnTo, remarks: r.remarks,
          };
    return {
      id: t.id, schema: t.schema, mode: t.mode, date: t.date, month: t.month, project: t.project, vehicle: t.vehicle,
      vtype: t.vtype, from: t.from, to: t.to, activity: t.activity, task: t.task, start: rd(t.start), end: rd(t.end),
      km: t.km, status: t.status, late: t.late, meterReset: t.meterReset, prior: t.prior, cancel: t.cancel,
      notes: t.notes.map((n) => ({ at: n.at, text: n.text })), loggedAt: t.loggedAt, chainPos: t.chainPos,
      prevHash: t.prevHash, lockedAt: t.lockedAt, hash: t.hash,
    };
  }

  async function reportContentHash(p) {
    const keys = [...p.photoHashes.keys()].sort();
    const tripHashes = [];
    for (const t of p.trips) tripHashes.push(await sha256Hex(djson(tripForHash(t))));
    const r = p.replaces;
    const core = [
      'vlb-report', p.format, p.reportId, p.revision, p.month,
      [p.staff.id, p.staff.name, p.staff.designation, p.staff.block, p.staff.district, p.staff.mobile],
      [p.policy.org, p.policy.office, p.policy.limitKm, new Dbl(p.policy.rate), p.policy.scope, p.policy.highKm],
      [p.summary.trips, p.summary.km, p.summary.within, p.summary.excess, new Dbl(p.summary.amount)],
      p.submittedAt,
      r ? [r.revision, r.step, r.name, r.role, r.remarks, r.at, r.hash] : '',
      tripHashes,
      keys.map((k) => [k, p.photoHashes.get(k)]),
    ];
    return sha256Hex(djson(core));
  }

  const signoffHash = (p, s) =>
    sha256Hex(
      djson(['vlb-signoff', p.reportId, p.revision, s.step, s.userId, s.name, s.designation, s.role, s.at, s.decision, s.remarks, s.excessApproved, s.prevHash])
    );

  // ------------------------------------------------------------------ figures

  /** Totals for a month, the way the phone works them out. */
  function summarise(trips, policy) {
    const kmBy = new Map();
    const countBy = new Map();
    let km = 0;
    let n = 0;
    for (const t of trips) {
      if (t.status !== 'closed') continue;
      const k = t.km === null || t.km === undefined ? 0 : t.km;
      km += k;
      n += 1;
      kmBy.set(t.project, (kmBy.get(t.project) || 0) + k);
      countBy.set(t.project, (countBy.get(t.project) || 0) + 1);
    }
    let within = 0;
    let excess = 0;
    let gauge = 0;
    if (policy.scope === 'project') {
      for (const v of kmBy.values()) {
        within += v > policy.limitKm ? policy.limitKm : v;
        excess += v > policy.limitKm ? v - policy.limitKm : 0;
        if (v > gauge) gauge = v;
      }
    } else {
      within = km > policy.limitKm ? policy.limitKm : km;
      excess = km > policy.limitKm ? km - policy.limitKm : 0;
      gauge = km;
    }
    return { trips: n, km, within, excess, amount: within * policy.rate, gaugeKm: gauge, kmByProject: kmBy, tripsByProject: countBy };
  }

  function tripFlags(t, policy) {
    const out = [];
    if (t.late !== null) out.push('Late entry');
    if (t.meterReset !== null) out.push('Meter reset');
    if (t.prior !== null && t.prior.none === true) out.push('No prior approval');
    if (t.start.oldPhoto === true || (t.end !== null && t.end.oldPhoto === true)) out.push('Photo not fresh');
    if ((t.km || 0) > policy.highKm) out.push('High km');
    return out;
  }

  // ------------------------------------------------------------------ where the report stands

  function statusOf(p) {
    if (p.signoffs.length === 0) return { stage: 'withBi', done: 0, returnedAt: null, last: null, nextStep: 'bi', finished: false };
    const last = p.signoffs[p.signoffs.length - 1];
    const idx = STEPS.indexOf(last.step);
    if (last.decision === 'return') {
      const i = idx < 0 ? 0 : idx;
      return { stage: 'returned', done: i, returnedAt: i, last, nextStep: null, finished: true };
    }
    const table = {
      submit: ['withBi', 1, 'bi'],
      bi: ['withAcc', 2, 'acc'],
      acc: ['withDi', 3, 'di'],
      di: ['approved', 4, null],
    };
    const row = table[last.step];
    if (!row) return { stage: 'withBi', done: 0, returnedAt: null, last, nextStep: 'bi', finished: false };
    return { stage: row[0], done: row[1], returnedAt: null, last, nextStep: row[2], finished: row[0] === 'approved' };
  }

  function stageLabel(st) {
    return { withBi: 'With Block Integrator', withAcc: 'With Accountant', withDi: 'With District Integrator', approved: 'Approved', returned: 'Returned' }[st.stage];
  }

  function approvalOf(p) {
    return p.signoffs.find((s) => s.step === 'di' && s.decision === 'approve') || null;
  }

  function payableKm(p) {
    const a = approvalOf(p);
    return p.summary.within + (a && a.excessApproved ? p.summary.excess : 0);
  }

  const payableAmount = (p) => payableKm(p) * p.policy.rate;

  // ------------------------------------------------------------------ signing

  /**
   * Adds [by]'s sign-off. [by] is {id, name, designation, role}. Throws ReportError when it is not their turn.
   * Returns a new report object; the one passed in is not changed.
   */
  async function signReport(p, by, opts) {
    const st = statusOf(p);
    const step = st.nextStep;
    if (step === null) throw new ReportError('This report has already finished. Nothing more can be signed on it.');
    if (by.id === p.staff.id) throw new ReportError('You cannot sign off your own report.');
    if (stepOfRole(by.role) !== step) {
      throw new ReportError(
        'This report is waiting for the ' + stepRoleLabel(step) + '. You are signed in as ' + stepRoleLabel(by.role) + '.'
      );
    }
    if (!decisionsFor(step).includes(opts.decision)) throw new ReportError('That is not a choice at this step.');
    const note = (opts.remarks || '').trim();
    if (opts.decision === 'return' && note === '') throw new ReportError('Write why you are sending it back.');
    const s = {
      step, userId: by.id, name: by.name, designation: by.designation || '', role: by.role,
      at: opts.at || new Date().toISOString(), decision: opts.decision, remarks: note,
      excessApproved: step === 'di' && opts.decision === 'approve' && p.summary.excess > 0 && opts.excessApproved === true,
      prevHash: p.signoffs[p.signoffs.length - 1].hash, hash: '',
    };
    s.hash = await signoffHash(p, s);
    return { ...p, signoffs: [...p.signoffs, s] };
  }

  // ------------------------------------------------------------------ checking

  const tripName = (t) => fmtDate(t.date) + ' to ' + t.to;

  function someOf(items) {
    return items.length <= 3 ? items.join('; ') : items.slice(0, 3).join('; ') + '; and ' + (items.length - 3) + ' more';
  }

  /**
   * The checks every person who opens a report runs. [actualPhotos] is a Map of photo name to the SHA-256 of
   * the picture really in the file. [previous] is the same person's report for the month before, if held.
   * Returns {ok, hasWarnings, lines:[{state:'ok'|'warn'|'bad', title, detail}]}.
   */
  async function verifyReport(p, actualPhotos, previous) {
    const lines = [];
    const add = (state, title, detail) => lines.push({ state, title, detail: detail || '' });
    const done = () => ({ ok: !lines.some((l) => l.state === 'bad'), hasWarnings: lines.some((l) => l.state === 'warn'), lines });

    // 1. The file is a whole report.
    const structure = [];
    if (p.format < 1 || p.format > REPORT_FORMAT) structure.push('It was made by a newer version of the app.');
    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(p.month)) structure.push('The month is not valid.');
    if (p.staff.id === '' || p.staff.name === '') structure.push('It does not say who sent it.');
    if (p.trips.length === 0) structure.push('It has no trips.');
    if (p.signoffs.length === 0 || p.signoffs[0].step !== 'submit') structure.push('It was never sent by the staff member.');
    if (structure.length) {
      add('bad', 'The report is incomplete', structure.join(' '));
      return done();
    }

    // 2. Nothing changed since it was sent.
    if ((await reportContentHash(p)) === p.contentHash) {
      add('ok', 'Report fingerprint matches', 'Nothing changed after the staff member sent it.');
    } else {
      add('bad', 'Report fingerprint does not match', 'Something in the trips, figures or photos changed after it was sent.');
    }

    // 3. Every trip still matches its seal.
    const badSeals = [];
    const wrongMonth = [];
    const stillOpen = [];
    for (const t of p.trips) {
      if (t.status === 'open') stillOpen.push(tripName(t));
      else if (!(await sealIntact(t))) badSeals.push(tripName(t));
      if (t.month !== p.month) wrongMonth.push(tripName(t));
    }
    if (stillOpen.length) add('bad', 'A trip is still open', someOf(stillOpen));
    else if (badSeals.length) add('bad', badSeals.length + ' of ' + p.trips.length + ' trips do not match their seal', someOf(badSeals));
    else {
      const cancelled = p.trips.filter((t) => t.status === 'cancelled').length;
      add(
        'ok',
        'All ' + p.trips.length + ' entries match their seals',
        cancelled > 0
          ? p.trips.length - cancelled + ' trips and ' + cancelled + ' cancelled. None was edited after it was locked.'
          : 'None was edited after it was locked.'
      );
    }
    if (wrongMonth.length) add('bad', 'Trips from another month are in this report', someOf(wrongMonth));

    // 4. The trips are linked one to the next.
    const byPos = p.trips.filter((t) => t.chainPos !== null).sort((a, b) => a.chainPos - b.chainPos);
    const unsealed = p.trips.length - byPos.length;
    const broken = [];
    const gaps = [];
    let dup = false;
    for (let i = 1; i < byPos.length; i++) {
      const a = byPos[i - 1];
      const b = byPos[i];
      if (a.chainPos === b.chainPos) dup = true;
      else if (b.chainPos === a.chainPos + 1) {
        if (b.prevHash !== a.hash) broken.push(tripName(a) + ' and ' + tripName(b));
      } else gaps.push(a.chainPos + 1 + '-' + (b.chainPos - 1));
    }
    if (unsealed > 0 || dup || broken.length) {
      add(
        'bad',
        'The chain of trips is broken',
        [
          unsealed > 0 ? unsealed + ' trips were never locked.' : '',
          dup ? 'Two trips share one place in the chain.' : '',
          broken.length ? 'Not linked: ' + someOf(broken) + '.' : '',
        ].filter(Boolean).join(' ')
      );
    } else if (gaps.length) {
      add(
        'warn',
        'Entries ' + someOf(gaps) + ' are not in this report',
        'They belong to another month, which is normal when a late entry crosses a month end. If that is not the case, ask for the full log.'
      );
    } else add('ok', 'Trips are linked in order', 'No entry is missing from the chain.');

    // 5. Odometer photos.
    let readings = 0;
    let missing = 0;
    let altered = 0;
    for (const t of p.trips) {
      for (const r of t.end ? [t.start, t.end] : [t.start]) {
        readings += 1;
        const key = r.photo || '';
        const want = r.photoHash || '';
        const listed = p.photoHashes.get(key);
        const actual = actualPhotos.get(key);
        if (key === '' || want === '' || listed === undefined || actual === undefined) missing += 1;
        else if (actual !== want || listed !== want) altered += 1;
      }
    }
    if (missing > 0 || altered > 0) {
      add(
        'bad',
        'Odometer photos: ' + (missing + altered) + ' of ' + readings + ' cannot be trusted',
        [missing > 0 ? missing + ' missing.' : '', altered > 0 ? altered + ' do not match the fingerprint taken when the trip was locked.' : ''].filter(Boolean).join(' ')
      );
    } else add('ok', 'All ' + readings + ' odometer photos are present and unchanged');

    // 6. The figures follow from the trips.
    const again = summarise(p.trips, p.policy);
    const s = p.summary;
    if (again.trips === s.trips && again.km === s.km && again.within === s.within && again.excess === s.excess && again.amount === s.amount) {
      add('ok', 'Figures match the trips', 'Km and amount were worked out again from the trips.');
    } else add('bad', 'Figures do not match the trips', 'The km or amount in the statement differ from the trips.');

    // 7. Sign-offs.
    const problems = [];
    let expectPrev = p.contentHash;
    for (let i = 0; i < p.signoffs.length; i++) {
      const so = p.signoffs[i];
      const who = signoffVerb(so) + ' by ' + so.name;
      if (i >= STEPS.length || so.step !== STEPS[i]) {
        problems.push(who + ' is out of order.');
        break;
      }
      if (so.prevHash !== expectPrev) problems.push(who + ' does not follow the one before it.');
      if ((await signoffHash(p, so)) !== so.hash) problems.push(who + ' was changed.');
      if (i === 0 && so.userId !== p.staff.id) problems.push('The first sign-off is not by the staff member.');
      if (i > 0 && so.userId === p.staff.id) problems.push(who + ' signed their own report.');
      if (!decisionsFor(so.step).includes(so.decision)) problems.push(who + ' has an invalid decision.');
      if (i < p.signoffs.length - 1 && (so.decision === 'return' || so.decision === 'approve')) problems.push('Someone signed after the report was finished.');
      expectPrev = so.hash;
    }
    if (problems.length) add('bad', 'Sign-offs do not add up', someOf(problems));
    else {
      const n = p.signoffs.length;
      add('ok', n === 1 ? 'Sent by ' + p.staff.name : n + ' sign-offs, in order and unchanged');
    }

    // 8. Continues from the month before.
    if (previous && byPos.length) {
      const earlier = previous.trips.filter((t) => t.chainPos !== null).sort((a, b) => a.chainPos - b.chainPos);
      if (earlier.length) {
        const last = earlier[earlier.length - 1];
        const first = byPos[0];
        if (first.chainPos === last.chainPos + 1 && first.prevHash === last.hash) {
          add('ok', 'Continues from the earlier month', 'The first trip follows the last one in the earlier report.');
        } else {
          add('warn', 'Does not continue from the earlier month', 'Some entries between the two reports may be missing, or the staff member changed phone.');
        }
      }
    }
    return done();
  }

  // ------------------------------------------------------------------ extra aids for a reviewer (not sealed)

  const readingOf = (t) => (t.end ? t.end.km : t.start.km);

  function tripOrder(a, b) {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    if (a.start.at !== b.start.at) return a.start.at < b.start.at ? -1 : 1;
    return a.start.km - b.start.km;
  }

  /**
   * Things a careful reviewer looks at that are not part of the seal: km against the meter readings, the meter
   * moving between trips, Sunday trips. Returns {lines, perTrip: Map(tripId -> [{state, text}]), unloggedKm}.
   */
  function reviewAids(p) {
    const perTrip = new Map();
    const note = (t, state, text) => {
      if (!perTrip.has(t.id)) perTrip.set(t.id, []);
      perTrip.get(t.id).push({ state, text });
    };
    const lines = [];

    const mismatch = [];
    const backwards = [];
    for (const t of p.trips) {
      if (t.status !== 'closed' || !t.end) continue;
      const diff = t.end.km - t.start.km;
      if (t.km !== diff) {
        mismatch.push(tripName(t));
        note(t, 'warn', 'Km recorded ' + t.km + ', meter readings give ' + diff + '.');
      }
      if (t.end.at && t.start.at && t.end.at < t.start.at) {
        backwards.push(tripName(t));
        note(t, 'warn', 'Closing time is before the opening time.');
      }
    }
    if (mismatch.length) lines.push({ state: 'warn', title: 'Km differs from the meter readings', detail: someOf(mismatch) });
    else lines.push({ state: 'ok', title: 'Km equals closing minus opening on every trip' });
    if (backwards.length) lines.push({ state: 'warn', title: 'Closing time is before opening time', detail: someOf(backwards) });

    // The meter, vehicle by vehicle.
    const byVehicle = new Map();
    for (const t of p.trips.filter((x) => x.status !== 'cancelled').sort(tripOrder)) {
      if (!byVehicle.has(t.vehicle)) byVehicle.set(t.vehicle, []);
      byVehicle.get(t.vehicle).push(t);
    }
    let unlogged = 0;
    const regress = [];
    const gapList = [];
    for (const list of byVehicle.values()) {
      for (let i = 1; i < list.length; i++) {
        const a = list[i - 1];
        const b = list[i];
        if (b.meterReset !== null) continue;
        const left = readingOf(a);
        if (b.start.km < left) {
          regress.push(tripName(b));
          note(b, 'warn', 'Opens at ' + fmtKm(b.start.km) + ', below the last closing ' + fmtKm(left) + ' (' + fmtDate(a.date) + ').');
        } else if (b.start.km > left) {
          const gap = b.start.km - left;
          unlogged += gap;
          gapList.push({ trip: b, gap, from: a });
          note(b, 'info', gap + ' km on the meter since the last logged trip (' + fmtDate(a.date) + ').');
        }
      }
    }
    if (regress.length) lines.push({ state: 'warn', title: 'Meter goes backwards between trips', detail: someOf(regress) });
    else lines.push({ state: 'ok', title: 'Meter only moves forward from trip to trip' });
    if (unlogged > 0) {
      lines.push({
        state: 'info',
        title: fmtKm(unlogged) + ' km on the meter between logged trips',
        detail: 'Not logged as work. ' + someOf(gapList.map((g) => fmtDate(g.trip.date) + ': ' + g.gap + ' km')),
      });
    }

    // Same day, same route, same km twice.
    const seen = new Map();
    const twice = [];
    for (const t of p.trips.filter((x) => x.status === 'closed')) {
      const k = [t.date, t.vehicle, t.from, t.to, t.km].join('|');
      if (seen.has(k)) {
        twice.push(tripName(t));
        note(t, 'warn', 'Looks like a repeat of another trip on the same day.');
      }
      seen.set(k, true);
    }
    if (twice.length) lines.push({ state: 'warn', title: 'Possible repeated trips', detail: someOf(twice) });

    // Sundays.
    const sundays = p.trips.filter((t) => t.status === 'closed' && /^\d{4}-\d{2}-\d{2}$/.test(t.date) && new Date(t.date + 'T00:00:00Z').getUTCDay() === 0);
    for (const t of sundays) note(t, 'info', 'Sunday.');
    if (sundays.length) lines.push({ state: 'info', title: sundays.length + (sundays.length === 1 ? ' trip' : ' trips') + ' on a Sunday', detail: someOf(sundays.map(tripName)) });

    return { lines, perTrip, unloggedKm: unlogged };
  }

  // ------------------------------------------------------------------ the file

  async function gunzip(bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function gzip(bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  function base64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /**
   * Opens a report file. Returns {report, photos: Map(name -> base64 text), raw}. [raw] is the file's own JSON, kept
   * so the file can be written back with one more sign-off and nothing else touched.
   */
  async function decodeReportFile(bytes) {
    if (!bytes || bytes.length === 0) throw new ReportError('The file is empty.');
    if (bytes.length > MAX_FILE_BYTES) throw new ReportError('The file is too large to be a report.');
    try {
      const raw = bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b ? await gunzip(bytes) : bytes;
      const text = new TextDecoder('utf-8', { fatal: true }).decode(raw);
      const json = JSON.parse(text);
      if (!isObj(json)) throw new ReportError('This file is not a vehicle log report.');
      const report = normReport(json);
      const photos = new Map();
      if (isObj(json.photos)) {
        const names = Object.keys(json.photos);
        if (names.length > MAX_PHOTOS) throw new ReportError('The file has too many photos.');
        for (const k of names) {
          if (!SAFE_NAME.test(k)) throw new ReportError('A photo in the file has a bad name.');
          if (typeof json.photos[k] !== 'string') throw new ReportError('This file is not a vehicle log report, or it is damaged.');
          photos.set(k, json.photos[k]);
        }
      }
      return { report, photos, raw: json };
    } catch (e) {
      if (e instanceof ReportError) throw e;
      throw new ReportError('This file is not a vehicle log report, or it is damaged.');
    }
  }

  /** SHA-256 of every photo in a file, by name. A picture that is not valid base64 is left out (so it counts as missing). */
  async function hashPhotos(photos) {
    const out = new Map();
    for (const [k, b64] of photos) {
      try {
        out.set(k, await sha256Hex(base64ToBytes(b64)));
      } catch (_) {
        /* left out */
      }
    }
    return out;
  }

  /** Everything the file shows about one report, after the checks. */
  async function openReportFile(bytes, previous) {
    const file = await decodeReportFile(bytes);
    const actual = await hashPhotos(file.photos);
    const check = await verifyReport(file.report, actual, previous);
    return { ...file, check };
  }

  /** The report as the file holds it: the file's own JSON with the sign-offs of [report] and the photos kept. */
  function reportToFileJson(report, raw, photos) {
    const out = { ...raw };
    out.signoffs = report.signoffs.map((s) => ({
      step: s.step, userId: s.userId, name: s.name, designation: s.designation, role: s.role, at: s.at,
      decision: s.decision, remarks: s.remarks, excessApproved: s.excessApproved, prevHash: s.prevHash, hash: s.hash,
    }));
    const ph = {};
    for (const [k, v] of photos) ph[k] = v;
    out.photos = ph;
    return out;
  }

  /** Packs a report and its photos into one compressed file (bytes). */
  async function encodeReportFile(report, raw, photos) {
    const text = JSON.stringify(reportToFileJson(report, raw, photos));
    return gzip(new TextEncoder().encode(text));
  }

  /** The same file as plain JSON text (no compression), for places that cannot save a .vlbreport. The phone opens it too. */
  function encodeReportJson(report, raw, photos) {
    return JSON.stringify(reportToFileJson(report, raw, photos));
  }

  function reportFileName(p) {
    const who = p.staff.name.trim().replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    return 'VehicleLog_' + p.month + '_' + (who === '' ? 'staff' : who) + '_r' + p.revision + '_s' + p.signoffs.length + '.' + FILE_EXT;
  }

  /** The message that goes with the file in WhatsApp or email. */
  function reportShareText(p) {
    const st = statusOf(p);
    const lines = ['Vehicle log, ' + fmtMonthLong(p.month) + ': ' + p.staff.name, fmtKm(p.summary.km) + ' km, ' + stageLabel(st) + '.'];
    const last = st.last;
    if (last && last.step !== 'submit') lines.push(signoffVerb(last) + ' by ' + last.name + ' (' + stepRoleLabel(last.step) + ').');
    lines.push('');
    if (st.stage === 'approved') lines.push('Approved. Open the file in Vehicle Log Book to see the sign-offs.');
    else if (st.stage === 'returned') lines.push('Sent back. Open the file in Vehicle Log Book to read the note.');
    else lines.push('Open the file in Vehicle Log Book (Review tab, Open a report file, or the desktop reviewer), check it and sign.');
    return lines.join('\n');
  }

  // ------------------------------------------------------------------ keeping several reports

  /**
   * How a file just opened relates to the copy already held: 'new', 'newer' (it carries more sign-offs),
   * 'same' (nothing new) or 'conflict' (signed differently).
   */
  function relate(have, incoming) {
    if (!have) return 'new';
    let same = have.contentHash === incoming.contentHash;
    const common = Math.min(have.signoffs.length, incoming.signoffs.length);

    if (i > 0) out.push(h('u', { class: i < st.done ? 'on' : '' }));

function modal({ title, body, actions, wide }) {
  return new Promise((resolve) => {
    let result = null;
    const dlg = h(
      'dialog',
      { class: 'modal' + (wide ? ' wide' : ''), 'aria-label': title },
      h('div', { class: 'dh' }, h('h2', null, title)),
      h('div', { class: 'db' }, body),
      h(
        'div',
        { class: 'df' },
        actions.map((a) =>
          h(
            'button',
            {
              class: 'btn ' + (a.kind || '') + (a.grow ? ' grow' : ''),
              type: 'button',
              onclick: () => {
                if (a.check && a.check() === false) return;
                result = a.value;
                dlg.close();
              },
            },
            a.label
          )
        )
      )
    );
    dlg.addEventListener('close', () => {
      dlg.remove();
      resolve(result);
    });
    document.body.appendChild(dlg);
    dlg.showModal();
  });
}

async function persistEntry(e) {
  await store.put('files', { key: e.key, bytes: e.bytes, savedAt: new Date().toISOString() });
}

/** Reads one report file into the list. Returns what happened, for the summary shown afterwards. */
async function addFileBytes(bytes, fileName) {
  const file = await V.decodeReportFile(bytes);
  const actual = await V.hashPhotos(file.photos);
  const incoming = { key: keyOf(file.report), report: file.report, photos: file.photos, raw: file.raw, actual, bytes };
  const have = state.entries.get(incoming.key);
  const rel = V.relate(have ? have.report : null, incoming.report);
  await summarize(incoming);
  const res = { name: fileName, entry: incoming, key: incoming.key };
  const who = incoming.report.staff.name + ', ' + V.fmtMonthLong(incoming.report.month);
  const badLines = incoming.check.lines.filter((l) => l.state === 'bad');

  if (rel === 'same') {
    const older = have.report.signoffs.length > incoming.report.signoffs.length;
    return { ...res, kind: 'same', entry: have, message: who + ': ' + (older ? 'you already hold a later copy with more sign-offs.' : 'already on this computer.') };
  }
  if (rel === 'conflict') {
    return { ...res, kind: 'conflict', entry: have, message: who + ': this copy was signed differently from the one you hold. Your copy was kept. Ask the others which one is current.' };
  }
  if (rel === 'newer' && !incoming.check.ok) {
    return { ...res, kind: 'rejected', entry: have, message: who + ': the newer copy fails its checks, so the copy you hold was kept.', why: badLines };
  }
  if (rel === 'newer') {
    incoming.meta = have.meta;
    if (incoming.meta) incoming.meta.key = incoming.key;
    freeUrls(have);
    state.entries.set(incoming.key, incoming);
    await persistEntry(incoming);
    return { ...res, kind: 'updated', message: who + ': updated, now ' + plural(incoming.report.signoffs.length, 'sign-off') + '.' };
  }
  state.entries.set(incoming.key, incoming);
  await persistEntry(incoming);
  if (!incoming.check.ok) return { ...res, kind: 'added', bad: true, message: who + ': added, but its checks failed. It cannot be signed.', why: badLines };
  return { ...res, kind: 'added', message: who + ': added.' };
}

async function handleFiles(files) {
  const list = Array.from(files || []);
  if (!list.length) return;
  state.busy = true;
  toast('Reading ' + plural(list.length, 'file') + '…');
  const results = [];
  for (const f of list) {
    try {
      results.push(await addFileBytes(new Uint8Array(await f.arrayBuffer()), f.name));
    } catch (err) {
      results.push({ name: f.name, kind: 'rejected', message: f.name + ': ' + (err instanceof V.ReportError ? err.message : 'This file could not be read.') });
    }
  }
  await recheckAll();
  state.busy = false;
  $$('.toast').forEach((n) => n.remove());
  const changed = results.filter((r) => r.kind === 'added' || r.kind === 'updated');
  if (results.length === 1 && changed.length === 1) {
    openReport(changed[0].key);
    toast(changed[0].kind === 'updated' ? 'Updated with the new sign-offs' : changed[0].bad ? 'Opened. Its checks failed.' : 'Report opened');
    return;
  }
  if (state.view === 'report') render();
  else {
    if (state.profile && Array.from(state.entries.values()).some(mineToSign)) state.tab = 'todo';
    render();
  }
  importSummary(results, changed);
}

function importSummary(results, changed) {
  const row = (r) => {
    const kind = r.kind === 'added' || r.kind === 'updated' ? (r.bad ? 'bad' : 'ok') : r.kind === 'same' ? 'warn' : 'bad';
    return h(
      'div',
      { class: 'res ' + kind },
      icon(kind === 'ok' ? 'check' : kind === 'warn' ? 'info' : 'x'),
      h('div', null, h('b', null, r.message), r.why && r.why.length ? h('div', { class: 'why muted' }, r.why.map((l) => h('div', null, l.title + (l.detail ? ': ' + l.detail : '')))) : null)
    );
  };
  const actions = [{ label: 'Close', value: false }];
  if (changed.length === 1) actions.push({ label: 'Open it', kind: 'primary', value: true });
  modal({ title: results.length === 1 ? 'The file was not added' : 'Files opened', body: h('div', { class: 'results' }, results.map(row)), actions }).then((go) => {
    if (go && changed.length === 1) openReport(changed[0].key);
  });
}

async function removeReport(e) {
  const p = e.report;
  const ok = await confirmDialog({
    title: 'Remove this report?',
    body: h('p', null, p.staff.name + ', ' + V.fmtMonthLong(p.month) + ' will be removed from this computer only. Nobody else is affected. Save a copy first if you still need it.'),
    confirm: 'Remove',
    danger: true,
  });
  if (!ok) return;
  freeUrls(e);
  state.entries.delete(e.key);
  await store.del('files', e.key);
  await store.del('meta', e.key);
  await recheckAll();
  if (state.openKey === e.key) goInbox();
  else render();
  toast('Removed');
}

function setChecked(e, id, v) {
  const m = metaOf(e);
  if (v) m.checked[id] = true;
  else delete m.checked[id];

  updateProgress(e);
  if (ui.filter === 'open' && !ui.lb) refreshTrips();
}
function markAll(e, v) {
  const m = metaOf(e);
  for (const t of e.trips) {
    if (t.status === 'cancelled') continue;

// ---------------------------------------------------------------- signing

async function startSign(e, decision) {
  const pr = state.profile;
  if (!pr) return profileDialog();
  const p = e.report;
  const step = e.status.nextStep;
  const act = ACTION[step];
  const note = ui.remarks.trim();
  if (decision === 'return' && !note) {
    ui.remarkErr = true;
    refreshAside();
    const r = $('#remarks');
    if (r) r.focus();
    return;
  }
  const label = decision === 'return' ? 'Send back to staff' : act[decision];
  const withExcess = step === 'di' && decision === 'approve' && p.summary.excess > 0 && ui.excess;
  const got = checkedCount(e);
  const total = tripsToCheck(e);
  const lines = [h('div', null, h('b', null, p.staff.name), ' · ' + V.fmtMonthLong(p.month) + ' · ' + fmtKm(p.summary.km) + ' km')];
  if (decision === 'return') lines.push(h('p', null, 'The report goes back to ' + p.staff.name + '. They will need to correct it and send a new revision.'));
  else if (step === 'di') {
    const km = p.summary.within + (withExcess ? p.summary.excess : 0);
    lines.push(h('p', null, 'Payable: ', h('b', null, fmtKm(km) + ' km, ' + fmtRs(km * p.policy.rate)), p.summary.excess > 0 ? (withExcess ? ' (includes ' + fmtKm(p.summary.excess) + ' km above the limit)' : ' (the ' + fmtKm(p.summary.excess) + ' km above the limit is not approved)') : ''));
  } else lines.push(h('p', null, 'It goes on to ' + act.next + '.'));
  if (decision !== 'return' && got < total) lines.push(h('div', { class: 'callout amber' }, icon('alert'), h('div', null, h('b', null, 'You have ticked ' + got + ' of ' + total + ' trips.'), h('div', { class: 'muted' }, 'Your signature says you checked the whole report.'))));
  if (note) lines.push(h('div', { class: 'note' }, note, h('small', null, 'Your remarks')));
  lines.push(h('p', { class: 'hint' }, 'This is added to the file as your signature, with your name and the time. It cannot be removed.'));
  const ok = await confirmDialog({ title: label + '?', body: h('div', { class: 'stack' }, lines), confirm: label, danger: decision === 'return' });
  if (!ok) return;
  try {
    const signed = await V.signReport(p, { id: pr.id, name: pr.name, designation: pr.designation, role: pr.role }, { decision, remarks: note, excessApproved: withExcess });
    const bytes = await V.encodeReportFile(signed, e.raw, e.photos);
    e.report = signed;
    e.bytes = bytes;
    await persistEntry(e);
    await summarize(e);
    ui.remarks = '';
    ui.excess = false;
    ui.remarkErr = false;
    render();
    if (!e.check.ok) toast('Signed, but the file no longer passes its checks. Please report this.');
    else toast(decision === 'return' ? 'Sent back. Save the file and send it to the staff member.' : 'Signed. Save the file and send it on.');
    const card = $('.sendcard');
    if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } catch (err) {
    toast(err && err.message ? err.message : 'The report could not be signed.');
  }
}

function lbFitScale() {
  const L = ui.lb;
  const sw = L.stage.clientWidth;
  const sh = L.stage.clientHeight;
  const sideways = L.rot % 180 !== 0;
  const w = sideways ? L.ih : L.iw;

  const L = ui.lb;
  const lo = Math.min(L.fit, 1) * 0.5;
  ns = Math.max(lo, Math.min(10, ns));
  const rect = L.stage.getBoundingClientRect();
  const dx = cx - (rect.left + rect.width / 2) - L.tx;
  const dy = cy - (rect.top + rect.height / 2) - L.ty;
  L.tx = cx - (rect.left + rect.width / 2) - (dx * ns) / L.s;
  L.ty = cy - (rect.top + rect.height / 2) - (dy * ns) / L.s;
  L.s = ns;
  lbPaint();
}

function drawOdometer(km, label) {
  const c = document.createElement('canvas');
  c.width = 960;
  c.height = 640;
  const g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 960, 640);
  bg.addColorStop(0, '#2b3a33');
  bg.addColorStop(1, '#101815');
  g.fillStyle = bg;
  g.fillRect(0, 0, 960, 640);
  g.fillStyle = '#0b100e';
  g.beginPath();
  g.roundRect(110, 200, 740, 240, 28);
  g.fill();
  g.strokeStyle = '#4b5d54';
  g.lineWidth = 6;
  g.stroke();
  const digits = String(km).padStart(6, '0');
  for (let i = 0; i < 6; i++) {
    const x = 150 + i * 112;
    g.fillStyle = i === 5 ? '#c99524' : '#e8efe9';
    g.beginPath();
    g.roundRect(x, 232, 96, 176, 10);
    g.fill();
    g.fillStyle = i === 5 ? '#1a1100' : '#101815';
    g.font = '700 150px "Barlow Semi Condensed", Arial, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(digits[i], x + 48, 322);
  }
  g.fillStyle = '#8da398';
  g.font = '600 34px "Barlow Semi Condensed", Arial, sans-serif';
  g.textAlign = 'left';
  g.fillText('KM', 150, 480);
  g.textAlign = 'right';
  g.fillText('SAMPLE PHOTO · ' + label, 810, 560);
  return c.toDataURL('image/jpeg', 0.8).split(',')[1];
}

// ---------------------------------------------------------------- drag and drop, start-up

function hasFiles(ev) {
  return !!(ev.dataTransfer && Array.from(ev.dataTransfer.types || []).includes('Files'));
}
let dragDepth = 0;
function veil(on) {
  let v = $('#veil');
  if (on && !v) {
    document.body.appendChild(h('div', { class: 'veil', id: 'veil' }, h('div', null, 'Drop report files to open them', h('small', null, 'They are read on this computer and are not uploaded'))));
  } else if (!on && v) v.remove();
}

async function boot() {
  const th = lsGet('vlb.theme');
  if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
  state.profile = loadProfile();
  $('#filein').addEventListener('change', async (ev) => {
    const files = Array.from(ev.target.files || []);
    ev.target.value = '';
    await handleFiles(files);
  });
  window.addEventListener('dragenter', (ev) => {
    if (!hasFiles(ev)) return;
    dragDepth += 1;
    veil(true);
  });
  window.addEventListener('dragover', (ev) => {
    if (hasFiles(ev)) ev.preventDefault();
  });
  window.addEventListener('dragleave', (ev) => {
    if (!hasFiles(ev)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) veil(false);
  });
  window.addEventListener('drop', (ev) => {
    if (!hasFiles(ev)) return;
    ev.preventDefault();
    dragDepth = 0;
    veil(false);
    handleFiles(ev.dataTransfer.files);
  });
  render();
  try {
    const rows = await store.all('files');
    const metas = new Map((await store.all('meta')).map((m) => [m.key, m]));
    for (const row of rows) {
      try {
        const file = await V.decodeReportFile(row.bytes);
        const entry = { key: row.key, report: file.report, photos: file.photos, raw: file.raw, actual: await V.hashPhotos(file.photos), bytes: row.bytes, meta: metas.get(row.key) };
        state.entries.set(entry.key, entry);
      } catch (_) {
        /* a damaged row is skipped */
      }
    }
    await recheckAll();
  } catch (_) {
    /* start empty */
  }
  if (state.profile && Array.from(state.entries.values()).some(mineToSign)) state.tab = 'todo';
  else if (!state.profile) state.tab = 'all';
  render();
}

window.__vlb = { state, ui, V, handleFiles, addFileBytes, loadSample, openReport };
boot();

})();

</script>

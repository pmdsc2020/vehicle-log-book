name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# The screenshot step pushes PNGs of every screen to a throwaway branch, ci-screenshots.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Dart errors show up here first, with file and line, in about a minute.
      - name: Analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Show analyze results on the run summary
        if: always()
        run: |
          if [ -f analyze.log ]; then
            msg=$( { grep -E '(error|warning|info) •' analyze.log | cut -c1-230 | head -30; } || true )
            [ -n "$msg" ] || msg=$(tail -3 analyze.log)
            msg=$(printf '%s' "$msg" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=flutter analyze::$msg"
          fi

      # Renders every screen at phone size. Fails on any layout overflow.
      - name: Screens test
        if: always()
        continue-on-error: true
        env:
          SHOTS: '1'
        run: |
          set -o pipefail
          FR=$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")
          export MATERIAL_ICONS=$(find "$FR" -name 'MaterialIcons-Regular.otf' -print -quit 2>/dev/null || true)
          export FALLBACK_FONT=$(fc-match -f '%{file}' 'DejaVu Sans' 2>/dev/null || echo /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf)
          echo "icons font: $MATERIAL_ICONS"
          echo "fallback font: $FALLBACK_FONT"
          flutter test test/shots_test.dart 2>&1 | tee test.log

      - name: Publish screenshots
        if: always()
        continue-on-error: true
        run: |
          if ls shots/*.png >/dev/null 2>&1; then
            rm -rf /tmp/shotrepo && mkdir /tmp/shotrepo && cp shots/*.png /tmp/shotrepo/
            cd /tmp/shotrepo
            git init -q -b ci-screenshots
            git config user.name "ci"
            git config user.email "ci@users.noreply.github.com"
            git add .
            git commit -q -m "Screenshots for ${GITHUB_SHA}"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
          fi

      - name: Show test results on the run summary
        if: always()
        run: |
          if [ -f test.log ]; then
            echo "::notice title=flutter test::$(tail -3 test.log | tr '\n' ' ' | cut -c1-300)"
            msg=$( { grep -E "Error:|error:|Expected:|Actual:|Some tests failed|isn't defined|isn't a" test.log | cut -c1-260 | head -20; grep -E -A2 "overflowed by|relevant error-causing widget" test.log | cut -c1-260 | head -30; } || true )
            if [ -n "$msg" ]; then
              msg=$(printf '%s' "$msg" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=flutter test::$msg"
            fi
          fi

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --android-skip-build-dependency-validation 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-log-book-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # If anything above failed, copy the useful lines into the run's annotations
      # so the cause is visible on the run summary page without opening the logs.
      - name: Show errors on the run summary
        if: failure()
        run: |
          if [ -f analyze.log ]; then
            msg=$( { grep -E 'error •' analyze.log | head -40; } || true )
            [ -n "$msg" ] || msg=$(tail -30 analyze.log)
            msg=$(printf '%s' "$msg" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flutter analyze::$msg"
          fi
          if [ -f build.log ]; then
            msg=$(tail -80 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flutter build apk::$msg"
          fi

name: Build APK

on:
  push:
    branches: [ main, 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Dart errors show up here first, with file and line, in about a minute.
      - name: Analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Show analyze results on the run summary
        if: always()
        run: |
          if [ -f analyze.log ]; then
            msg=$( { grep -E '(error|warning|info) •' analyze.log | cut -c1-230 | head -30; } || true )
            [ -n "$msg" ] || msg=$(tail -3 analyze.log)
            msg=$(printf '%s' "$msg" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=flutter analyze::$msg"
          fi

      # Runs every test: the report file and sign-off logic, and a render of every screen at phone size
      # (which reports any layout overflow). Does not block the APK.
      - name: Screens test
        if: always()
        continue-on-error: true
        env:
          SHOTS: '1'
        run: |
          set -o pipefail
          FR=$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")
          export MATERIAL_ICONS=$(find "$FR" -name 'MaterialIcons-Regular.otf' -print -quit 2>/dev/null || true)
          export FALLBACK_FONT=$(fc-match -f '%{file}' 'DejaVu Sans' 2>/dev/null || echo /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf)
          echo "icons font: $MATERIAL_ICONS"
          echo "fallback font: $FALLBACK_FONT"
          flutter test --reporter expanded 2>&1 | tee test.log

      - name: Upload screen images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: shots/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Show test results on the run summary
        if: always()
        run: |
          if [ -f test.log ]; then
            echo "::notice title=flutter test::$(tail -3 test.log | tr '\n' ' ' | cut -c1-300)"
            msg=$( { grep -E -B45 -A3 "\[E\]" test.log | cut -c1-240 | head -110; grep -E "Error:|error:|isn't defined|isn't a" test.log | cut -c1-240 | head -10; grep -E -A2 "overflowed by|relevant error-causing widget" test.log | cut -c1-240 | head -30; } || true )
            if [ -n "$msg" ]; then
              msg=$(printf '%s' "$msg" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=flutter test::$msg"
            fi
          fi

      # TEMPORARY: print the report files made by test/web_vectors_test.dart so the desktop reviewer can be
      # tested against files made by the phone code.
      - name: Show report files for the desktop tests
        if: always()
        continue-on-error: true
        run: |
          [ -f test.log ] || exit 0
          grep -o 'VEC [a-z0-9_]* [A-Za-z0-9+/=]*' test.log | sort -u | while read -r _ name data; do
            echo "::notice title=VEC $name::$data"
          done

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --android-skip-build-dependency-validation 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-log-book-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # If anything above failed, copy the useful lines into the run's annotations
      # so the cause is visible on the run summary page without opening the logs.
      - name: Show errors on the run summary
        if: failure()
        run: |
          if [ -f analyze.log ]; then
            msg=$( { grep -E 'error •' analyze.log | head -40; } || true )
            [ -n "$msg" ] || msg=$(tail -30 analyze.log)
            msg=$(printf '%s' "$msg" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flutter analyze::$msg"
          fi
          if [ -f build.log ]; then
            msg=$(tail -80 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flutter build apk::$msg"
          fi
